name: Publish to PyPI

# Triggers on a GitHub Release creation (v* tag).  To publish:
#   1. Create a release on GitHub with a tag like "v0.1.2".
#   2. This workflow builds the sdist + wheel and uploads them to PyPI using
#      the trusted-publisher (OIDC) mechanism — no API token stored in secrets.
#
# Prerequisites (one-time setup):
#   - Add this repository as a trusted publisher on https://pypi.org/manage/
#     project/kairos/settings/publishing/ with:
#       Publisher: GitHub Actions
#       Owner: Jacobcdsmith
#       Repository: kairos
#       Workflow name: publish.yml
#       Environment name: pypi

on:
  release:
    types: [published]

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/kairos/
    permissions:
      id-token: write  # required for OIDC trusted-publisher upload

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
