name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Ruff format
        run: ruff format --check src tests

      - name: Ruff lint
        run: ruff check src tests

      - name: Pytest
        run: pytest -q

      - name: Install TUI extras
        run: pip install -e ".[tui,tui-test]"

      # Runs after the TUI extras are installed (unlike the base Pytest step
      # above) so pyright can actually resolve `textual`/`textual.*` imports
      # in src/kairos/tui and tests/tui — pyrightconfig's `include` covers
      # both unconditionally, so without this ordering every TUI-touching
      # file fails with hundreds of reportUnknown* cascade errors regardless
      # of whether the code itself is otherwise correct.
      - name: Pyright
        run: pyright

      - name: Pytest (TUI)
        run: pytest -q tests/tui

      - name: Build sdist + wheel
        run: python -m build --no-isolation

      - name: Verify install from built artifacts
        run: PYTHON_BIN=python bash scripts/verify_install.sh

      - name: Demo (end-to-end smoke test)
        run: KAIROS_BIN="$(python -c 'import shutil; print(shutil.which("kairos"))')" bash scripts/demo.sh
